services:
  cartenz-smartgov-backup-agent:
    image: adityabintang/smartgov-backup-agent:v1.0
    build: .
    container_name: cartenz-smartgov-backup-agent
    restart: unless-stopped
    ports:
      # Default hanya localhost (dashboard memakai HTTP Basic; jangan ekspos tanpa TLS).
      # Akses remote: SSH tunnel / reverse proxy HTTPS, atau set AGENT_BIND_ADDR=0.0.0.0 di .env
      - "${AGENT_BIND_ADDR:-127.0.0.1}:25200:25200"
    volumes:
      - ./agent_data:/app/data
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./secrets:/app/secrets
      # Scheduler mengikuti zona waktu lokal server.
      - /etc/localtime:/etc/localtime:ro
      # Opsional: berkas aplikasi yang ikut dibackup (read-only)
      # - /path/ke/smartgov_app:/app/smartgov_app:ro
    # Hardening container
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - smartgov-network

networks:
  smartgov-network:
    external: true
